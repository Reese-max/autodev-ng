name: Feature request
description: Propose a bounded change that can be verified by the IssueOps loop.
title: "[feature] "
labels: ["autodev"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing Issues and did not find a duplicate.
          required: true
        - label: I removed secrets, tokens, and private data from this request.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected and what problem needs solving?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful behavior and important non-goals.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Give observable checks, test expectations, and failure behavior.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and risk
      description: List affected modules, compatibility constraints, and migration or rollback concerns.
    validations:
      required: true
