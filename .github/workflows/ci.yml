name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    # Full regression exercises Windows file locks and process-tree supervision.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Kernel relocation checks compare historical commits.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:flaky-regression
