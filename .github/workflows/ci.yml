name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    # Full regression exercises Windows file locks and process-tree supervision.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Kernel relocation checks compare historical commits.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify Node.js 22 runtime
        shell: pwsh
        run: |
          $version = node --version
          if ($LASTEXITCODE -ne 0) { throw "node --version failed" }
          if ($version -notmatch '^v22\.') { throw "Expected Node.js 22; got '$version'" }
          Write-Output "Verified Node.js $version"
      - run: npm ci
      - run: npm run typecheck
      - name: Run trusted structured regression verdict tests
        run: npm test -- tests/github-regression-tap.test.ts
      - name: Run lock ownership regressions
        run: npm test -- tests/lock.test.ts tests/lock-generation.test.ts tests/lock-errors.test.ts tests/lock-pidfile-cleanup.test.ts tests/github-owner-lock-team.integration.test.ts
      - run: npm run test:flaky-regression
      - name: Run retained GitHub regression tests
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath tests/regressions) {
            $regressionFiles = @(Get-ChildItem -LiteralPath tests/regressions -Filter '*.test.cjs' -File -ErrorAction Stop)
            if ($regressionFiles.Count -gt 0) {
              & node --test --test-reporter=tap @($regressionFiles.FullName)
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
