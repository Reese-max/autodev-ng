name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test

  dependency-upgrade:
    name: dependency-upgrade (fastapi/starlette/httpx)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run test:dep-upgrade
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-upgrade-evidence
          path: data/dependency-upgrade-evidence.json
          retention-days: 90
