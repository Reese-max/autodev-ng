name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    name: Windows regression ${{ matrix.shard }}/3
    # Full regression exercises Windows file locks and process-tree supervision.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          # Kernel relocation checks compare historical commits.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify Node.js 22 runtime
        shell: pwsh
        run: |
          $version = node --version
          if ($LASTEXITCODE -ne 0) { throw "node --version failed" }
          if ($version -notmatch '^v22\.') { throw "Expected Node.js 22; got '$version'" }
          Write-Output "Verified Node.js $version"
      - run: npm ci
      - run: npm run typecheck
      - name: Run owner fairness and policy regressions
        run: npm test -- tests/github-owner-fairness.test.ts tests/github-owner-recovery.integration.test.ts tests/github-owner-policy.test.ts tests/github-owner-lock-team.integration.test.ts
      - name: Run trusted structured regression verdict tests
        run: npm test -- tests/github-regression-tap.test.ts
      - name: Run GitHub global budget regressions
        run: npm test -- tests/github-budget-scope.test.ts tests/github-owner-budget-policy.test.ts tests/globalcost-evidence.test.ts tests/globalcost.test.ts tests/attempt-accounting.test.ts tests/scheduler.test.ts tests/autopilot-perpetual.test.ts
      - name: Run verification command chain regressions
        run: npm test -- tests/verify-steps.test.ts
      - name: Run LongHorizon backend regression tests
        run: npm test -- tests/long-horizon-backend.test.ts tests/long-horizon-auditor-http.test.ts tests/long-horizon-lock.test.ts tests/cli-run.test.ts
      - name: Run lock ownership regressions
        run: npm test -- tests/lock.test.ts tests/lock-generation.test.ts tests/lock-errors.test.ts tests/lock-pidfile-cleanup.test.ts tests/github-owner-lock-team.integration.test.ts
      - name: Run two-round regression suite
        run: npm run test:flaky-regression -- --ci-shard ${{ matrix.shard }} --report-dir "${{ runner.temp }}/windows-regression" --expected-sha "${{ github.sha }}"
        env:
          AUTODEV_GH_REPAIR_DIAGNOSTIC_DIR: ${{ runner.temp }}
      - name: Run retained GitHub regression tests
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath tests/regressions) {
            $regressionFiles = @(Get-ChildItem -LiteralPath tests/regressions -Filter '*.test.cjs' -File -ErrorAction Stop)
            if ($regressionFiles.Count -gt 0) {
              & node --test --test-reporter=tap @($regressionFiles.FullName)
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
      - name: Upload synthetic Issue 16 follow-up diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-16-repair-follow-up-diagnostics-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/autodev-ng-issue16-followup-*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload exact two-round shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-regression-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-regression/shard-${{ matrix.shard }}.receipt.json
          if-no-files-found: error
  test:
    name: test
    needs: windows
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Windows job and its retained checks
        env:
          WINDOWS_MATRIX_RESULT: ${{ needs.windows.result }}
        run: test "$WINDOWS_MATRIX_RESULT" = success
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-regression-shard-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-regression-reports
      - name: Require both rounds of every exact-head spec
        run: node dist/engines/flaky-regression.js --aggregate "${{ runner.temp }}/windows-regression-reports" --expected-sha "${{ github.sha }}"
